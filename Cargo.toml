[package]
name = "neon-core"
version = "0.1.0"
edition = "2021"

[features]
default = []
demo = []

[dependencies]
macroquad = { version = "0.4", features = ["audio"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[package.metadata.android]
android_version = 35
target_sdk_version = 35
min_sdk_version = 26
package_name = "dev.vex.neoncore"
label = "Neon Core"
fullscreen = true
build_targets = ["aarch64-linux-android"]

[package.metadata.android.activity_attributes]
"android:exported" = "true"
"android:screenOrientation" = "sensorLandscape"
