name: CI, Validation & Cross-Platform Release Builds

on:
  push:
    branches: [ main, "refactor/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    name: Format, Clippy, Check & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux desktop system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev

      - name: Install Rust toolchain (rustfmt, clippy, wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-validate-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-validate-

      - name: Verify formatting (cargo fmt --check)
        run: cargo fmt --all -- --check

      - name: Check native target
        run: cargo check --all-targets

      - name: Check WebAssembly demo target
        run: cargo check --target wasm32-unknown-unknown --features demo

      - name: Run Clippy lints
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit, regression & simulation tests
        run: cargo test -- --nocapture

  build-android:
    name: Build Native Android APK (ARM64, SDK 35)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Rust & Android ARM64 Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android SDK Platform 35, Build-Tools 35.0.0 & NDK r25
        run: |
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;25.2.9519653"

      - name: Cache cargo-quad-apk
        id: cache-quad-apk
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-quad-apk
          key: ${{ runner.os }}-cargo-quad-apk-d411c8f

      - name: Install cargo-quad-apk (modern Java 17 + aapt2/d8)
        if: steps.cache-quad-apk.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
          cargo install --git https://github.com/not-fl3/cargo-quad-apk --rev d411c8f --locked

      - name: Cache Cargo registry and Android target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/aarch64-linux-android/
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-android-

      - name: Build Native Android APK (Release)
        run: |
          set -euo pipefail
          export NDK_HOME="$ANDROID_HOME/ndk/25.2.9519653"
          export ANDROID_NDK_HOME="$NDK_HOME"
          TOOLCHAIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          BIN_DIR="$TOOLCHAIN/bin"
          [ -e "$BIN_DIR/ld" ] || ln -sf "$BIN_DIR/ld.lld" "$BIN_DIR/ld"

          cargo quad-apk build --release

          APK_PATH="target/android-artifacts/release/apk/neon_core.apk"
          test -f "$APK_PATH"

          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          TMP_INSPECT="$(mktemp -d)"
          unzip -q "$APK_PATH" "lib/arm64-v8a/*" -d "$TMP_INSPECT"
          test -f "$TMP_INSPECT/lib/arm64-v8a/libneon_core.so"

          NEEDED_LIBS="$("$BIN_DIR/llvm-readelf" -d "$TMP_INSPECT/lib/arm64-v8a/libneon_core.so" | grep '(NEEDED)' || true)"
          echo "Needed shared libraries:"
          echo "$NEEDED_LIBS"

          if echo "$NEEDED_LIBS" | grep -q 'libc++_shared.so' && [ ! -f "$TMP_INSPECT/lib/arm64-v8a/libc++_shared.so" ]; then
            echo "Bundling missing libc++_shared.so into lib/arm64-v8a/..."
            mkdir -p "$TMP_INSPECT/repack/lib/arm64-v8a"
            cp "$TOOLCHAIN/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" "$TMP_INSPECT/repack/lib/arm64-v8a/libc++_shared.so"
            cp "$APK_PATH" "$TMP_INSPECT/unaligned.apk"
            (cd "$TMP_INSPECT/repack" && zip -u "$TMP_INSPECT/unaligned.apk" "lib/arm64-v8a/libc++_shared.so")
            "$BUILD_TOOLS_DIR/zipalign" -f -v 4 "$TMP_INSPECT/unaligned.apk" "$APK_PATH"
            "$BUILD_TOOLS_DIR/apksigner" sign --ks "$HOME/.android/debug.keystore" --ks-pass pass:android "$APK_PATH"
          fi

          echo "=== Verifying APK Badging & Signature ==="
          "$BUILD_TOOLS_DIR/aapt2" dump badging "$APK_PATH" | grep -E "package:|sdkVersion:|targetSdkVersion:|application-icon|launchable-activity:"
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$APK_PATH"
          rm -rf "$TMP_INSPECT"

      - name: Upload Native Android APK
        uses: actions/upload-artifact@v7
        with:
          name: neon-core-rust-android-apk
          path: target/android-artifacts/release/apk/neon_core.apk
          if-no-files-found: error

  build-wasm:
    name: Build WebAssembly Demo (wasm32)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust & WASM Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry and WASM target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/wasm32-unknown-unknown/
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-

      - name: Build WASM Web Demo (Release)
        run: |
          set -euo pipefail
          cargo build --release --target wasm32-unknown-unknown --features demo
          mkdir -p web-demo
          cp target/wasm32-unknown-unknown/release/neon_core.wasm web-demo/
          curl -sL https://not-fl3.github.io/miniquad-samples/mq_js_bundle.js -o web-demo/mq_js_bundle.js
          cat << 'IDX' > web-demo/index.html
          <!doctype html>
          <html lang="pl">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
            <title>NEON CORE [RUST WASM DEMO]</title>
            <style>html, body, canvas { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #04060b; touch-action: none; }</style>
          </head>
          <body>
            <canvas id="glcanvas" tabindex="1"></canvas>
            <script src="mq_js_bundle.js"></script>
            <script>load("neon_core.wasm");</script>
          </body>
          </html>
          IDX
          cd web-demo && zip -r ../neon-core-rust-wasm-demo.zip .

      - name: Upload WASM Web Demo
        uses: actions/upload-artifact@v7
        with:
          name: neon-core-rust-wasm-demo
          path: neon-core-rust-wasm-demo.zip
          if-no-files-found: error

  build-desktop:
    name: Build Native Desktop Binary (Linux x86_64)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux desktop system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and desktop release target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/release/
          key: ${{ runner.os }}-cargo-desktop-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-desktop-

      - name: Build Native Desktop Release
        run: |
          set -euo pipefail
          cargo build --release
          cp target/release/neon_core neon_core-linux-x86_64
          chmod +x neon_core-linux-x86_64

      - name: Upload Native Desktop Binary
        uses: actions/upload-artifact@v7
        with:
          name: neon-core-linux-x86_64
          path: neon_core-linux-x86_64
          if-no-files-found: error

  build-windows:
    name: Build Native Windows Binary (x86_64)
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and Windows release target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/release/
          key: ${{ runner.os }}-cargo-windows-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-windows-

      - name: Build Native Windows Release
        shell: pwsh
        run: |
          cargo build --release
          Copy-Item target/release/neon_core.exe neon_core-windows-x86_64.exe

      - name: Upload Native Windows Binary
        uses: actions/upload-artifact@v7
        with:
          name: neon-core-windows-x86_64
          path: neon_core-windows-x86_64.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [ build-android, build-wasm, build-desktop, build-windows ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.apk
            artifacts/**/*.zip
            artifacts/**/neon_core-linux-x86_64
            artifacts/**/*.exe
